<!DOCTYPE html>
<html>
<head>
<title>IPL Registration Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background-color:#f2f2f2;
}

.form{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
    background-color: aquamarine;
}
.for
{
    background-color: aquamarine;
}
</style>

</head>

<body>

<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-6">

<div class="form">

<h3 class="text-center">IPL Player Registration</h3>

<form class="for">

<div class="mb-3">
Full Name<br>
<input type="text">
</div>

<div class="mb-3">
Email<br>
<input type="email">
</div>

<div class="mb-3">
Phone Number<br>
<input type="tel">
</div>

<div class="mb-3">
Age<br>
<input type="number" >
</div>

<div class="mb-3">
Select Position<br>
<select >
<option>Batsman</option>
<option>Bowler</option>
<option>All Rounder</option>

</select>
</div>

<div class="mb-3">
Gender<br>

<div >
<input  type="radio" name="type">
male
</div>

<div >
<input type="radio" name="type">
female
</div>

</div>

</form>

</div>

</div>
</div>
</div>

</body>
</html>
